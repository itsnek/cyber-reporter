name: Daily Cyber Digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Runs at ~4:00 AM UTC every day (avoids the :00 top-of-hour queue, when GitHub's scheduler is most delayed)
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install feedparser==6.0.14 google-genai==2.23.0
      - run: python cyber-reporter.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: "highyankee@gmail.com"
          EMAIL_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          EMAIL_RECEIVER: "nsiachamis@gmail.com"